<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <!-- Pearlescent silver-lavender with soft pink-white glow (Neri's hair & eye palette) -->
    <linearGradient id="neriTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#FBE8F3"/>
      <stop offset="78%" stop-color="#DBD1EC"/>
      <stop offset="100%" stop-color="#BFB3D6"/>
    </linearGradient>

    <linearGradient id="whiteBowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4EEF9"/>
      <stop offset="100%" stop-color="#D2C7E5"/>
    </linearGradient>

    <linearGradient id="redBowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DF4F6E"/>
      <stop offset="55%" stop-color="#B92D4E"/>
      <stop offset="100%" stop-color="#871C38"/>
    </linearGradient>

    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EFE9F7"/>
      <stop offset="100%" stop-color="#CFC4E2"/>
    </linearGradient>

    <radialGradient id="pomGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#453544"/>
      <stop offset="65%" stop-color="#1E1621"/>
      <stop offset="100%" stop-color="#0E0A10"/>
    </radialGradient>

    <filter id="softGlow" x="-15%" y="-20%" width="130%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.08
                0 0.72 0 0 0.02
                0 0 1 0 0.14
                0 0 0 0.55 0" result="tinted"/>
      <feMerge>
        <feMergeNode in="tinted"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main horizontal wordmark -->
  <g filter="url(#softGlow)">
    <text x="56" y="134"
          font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
          font-size="108"
          font-weight="600"
          letter-spacing="1.5"
          fill="url(#neriTextGrad)"
          stroke="#FFFFFF"
          stroke-opacity="0.35"
          stroke-width="1">ChatGPT</text>
  </g>

  <!-- 1. Neri's dark "×" hairpin clipped on upper-left of "C" -->
  <g transform="translate(74, 72) rotate(-14)">
    <rect x="-15" y="-2.6" width="30" height="5.2" rx="2.6" fill="#2A1C28" stroke="#6E5269" stroke-width="0.8" transform="rotate(42)"/>
    <rect x="-15" y="-2.6" width="30" height="5.2" rx="2.6" fill="#2A1C28" stroke="#6E5269" stroke-width="0.8" transform="rotate(-42)"/>
  </g>

  <!-- 2. Delicate white feather curving along the bottom-left of "C" -->
  <g transform="translate(52, 114)">
    <path d="M 0,0 C 8,19 26,30 56,24 C 38,34 15,28 2,10 Z"
          fill="url(#featherGrad)" stroke="#9B8FB2" stroke-width="0.9"/>
    <path d="M -3,-4 C 9,15 27,26 54,23"
          fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
    <!-- subtle feather notches -->
    <path d="M 16,19 L 12,24 M 27,24 L 24,29 M 38,26 L 36,30"
          stroke="#A89CBF" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 3. Neri's crimson-berry bow + twin black pom-pom cords on the "t" -->
  <g transform="translate(274, 83)">
    <!-- Twin hanging cords -->
    <path d="M -2,4 Q -7,24 -10,41" fill="none" stroke="#1E141E" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M 2,4 Q 7,24 10,41" fill="none" stroke="#1E141E" stroke-width="2.1" stroke-linecap="round"/>
    <!-- Fluffy black pom-poms -->
    <circle cx="-10" cy="43" r="5.5" fill="url(#pomGrad)" stroke="#554057" stroke-width="0.7"/>
    <circle cx="10" cy="43" r="5.5" fill="url(#pomGrad)" stroke="#554057" stroke-width="0.7"/>
    <!-- Ribbon tails -->
    <path d="M -2,2 L -13,18 L -6,15 L -3,21 L 0,4 Z" fill="url(#redBowGrad)" stroke="#481424" stroke-width="0.9"/>
    <path d="M 2,2 L 13,18 L 6,15 L 3,21 L 0,4 Z" fill="url(#redBowGrad)" stroke="#481424" stroke-width="0.9"/>
    <!-- Left & right bow loops -->
    <path d="M -2,0 C -14,-11 -22,-5 -20,3 C -18,10 -10,8 -2,2 Z" fill="url(#redBowGrad)" stroke="#481424" stroke-width="0.9"/>
    <path d="M 2,0 C 14,-11 22,-5 20,3 C 18,10 10,8 2,2 Z" fill="url(#redBowGrad)" stroke="#481424" stroke-width="0.9"/>
    <!-- Inner folds -->
    <path d="M -4,1 C -10,-2 -13,0 -14,2 M 4,1 C 10,-2 13,0 14,2" fill="none" stroke="#F68DA5" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
    <!-- Center knot -->
    <rect x="-3.8" y="-3.8" width="7.6" height="7.6" rx="2.4" fill="#C63759" stroke="#481424" stroke-width="0.9"/>
  </g>

  <!-- 4. Little black cat perched on top of "G" -->
  <g transform="translate(340, 56)">
    <!-- Curled tail -->
    <path d="M 16,2 C 25,-3 26,-16 20,-19 C 16,-21 15,-16 18,-15"
          fill="none" stroke="#18121E" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 16,2 C 25,-3 26,-16 20,-19 C 16,-21 15,-16 18,-15"
          fill="none" stroke="#B7A4D4" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
    <!-- Body -->
    <path d="M -12,4 C -10,-6 8,-7 17,0 C 19,3 17,6 13,6 L -10,6 C -13,6 -13,5 -12,4 Z"
          fill="#18121E" stroke="#A794C7" stroke-width="0.75"/>
    <!-- Head & ears -->
    <path d="M -16,-3 L -15,-14 L -8,-8 C -5,-9 -2,-9 0,-8 L 5,-14 L 6,-2 C 7,4 2,8 -5,8 C -12,8 -17,3 -16,-3 Z"
          fill="#18121E" stroke="#A794C7" stroke-width="0.75"/>
    <!-- Cute tiny paws -->
    <ellipse cx="-8" cy="7" rx="3.2" ry="2.2" fill="#18121E"/>
    <ellipse cx="1" cy="7" rx="3.2" ry="2.2" fill="#18121E"/>
    <!-- Tiny luminous eyes -->
    <ellipse cx="-9.5" cy="0" rx="1.4" ry="2" fill="#FBE8F3"/>
    <ellipse cx="-1.5" cy="0" rx="1.4" ry="2" fill="#FBE8F3"/>
  </g>

  <!-- 5. Neri's crisp white satin ribbon bow on top-right of "T" -->
  <g transform="translate(494, 62) rotate(24)">
    <!-- Ribbon tails -->
    <path d="M -2,4 L -19,24 L -10,20 L -6,27 L 0,5 Z" fill="url(#whiteBowGrad)" stroke="#8F82A8" stroke-width="1"/>
    <path d="M 2,4 L 21,23 L 12,19 L 9,27 L 0,5 Z" fill="url(#whiteBowGrad)" stroke="#8F82A8" stroke-width="1"/>
    <!-- Left & right loops -->
    <path d="M -3,0 C -18,-16 -30,-6 -26,5 C -23,13 -12,11 -3,3 Z" fill="url(#whiteBowGrad)" stroke="#8F82A8" stroke-width="1"/>
    <path d="M 3,0 C 18,-16 30,-6 26,5 C 23,13 12,11 3,3 Z" fill="url(#whiteBowGrad)" stroke="#8F82A8" stroke-width="1"/>
    <!-- Fold creases -->
    <path d="M -6,1 C -14,-2 -19,0 -20,3 M 6,1 C 14,-2 19,0 20,3" fill="none" stroke="#B6AACB" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Center knot -->
    <rect x="-4.5" y="-4.5" width="9" height="9" rx="3" fill="#FFFFFF" stroke="#8F82A8" stroke-width="1"/>
  </g>

  <!-- 6. Starry-night four-point sparkles -->
  <g filter="url(#starGlow)">
    <!-- Main star near white bow -->
    <path d="M 522,26 L 524.5,37 L 535,39.5 L 524.5,42 L 522,53 L 519.5,42 L 509,39.5 L 519.5,37 Z" fill="#FFF7FC"/>
    <!-- Secondary small sparkles -->
    <path d="M 118,44 L 119.4,50 L 125,51.4 L 119.4,52.8 L 118,58.8 L 116.6,52.8 L 111,51.4 L 116.6,50 Z" fill="#F5E6FF" opacity="0.9"/>
    <path d="M 518,104 L 519.2,109 L 524,110.2 L 519.2,111.4 L 518,116.4 L 516.8,111.4 L 512,110.2 L 516.8,109 Z" fill="#F5E6FF" opacity="0.85"/>
    <circle cx="212" cy="70" r="1.8" fill="#FFF2FA" opacity="0.8"/>
    <circle cx="136" cy="144" r="1.5" fill="#E8D8FF" opacity="0.75"/>
  </g>
</svg>
