<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Neri Quota Exhausted Icon (额度用尽状态)
    Matches chatgpt_quota_neri_dual_dynamic.svg geometry: center (32, 29), r=21, bottom bow at (32, 55.2)
  -->
  <defs>
    <!-- Soft rose-crimson warning ring gradient -->
    <linearGradient id="exhRingGrad" gradientUnits="userSpaceOnUse" x1="11" y1="8" x2="53" y2="50">
      <stop offset="0%" stop-color="#FFB6CE"/>
      <stop offset="50%" stop-color="#E5648B"/>
      <stop offset="100%" stop-color="#A63A63"/>
    </linearGradient>

    <!-- Inner exclamation crystal gradient -->
    <linearGradient id="exhMarkGrad" gradientUnits="userSpaceOnUse" x1="32" y1="16" x2="32" y2="42">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFD0E2"/>
      <stop offset="100%" stop-color="#EB658E"/>
    </linearGradient>

    <!-- Soft crimson inner aura -->
    <radialGradient id="exhAura" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#E85A84" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#8A2448" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8A2448" stop-opacity="0"/>
    </radialGradient>

    <!-- Signature mini crimson bow -->
    <linearGradient id="exhCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E55474"/>
      <stop offset="60%" stop-color="#B82A4C"/>
      <stop offset="100%" stop-color="#831934"/>
    </linearGradient>

    <filter id="exhGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle crimson-rose starry aura -->
  <circle cx="32" cy="29" r="19" fill="url(#exhAura)"/>

  <!-- Dimmed base track ring -->
  <circle cx="32" cy="29" r="21"
          fill="none"
          stroke="#9E708B"
          stroke-opacity="0.22"
          stroke-width="3.6"/>

  <!-- Starry dashed/dotted exhausted ring (echoes native exhausted dotted circle) -->
  <circle cx="32" cy="29" r="21"
          fill="none"
          stroke="url(#exhRingGrad)"
          stroke-width="3.8"
          stroke-linecap="round"
          stroke-dasharray="2.4 8.6"
          filter="url(#exhGlow)"/>

  <!-- Side starlight separator nodes (keeps visual continuity with dual-arc icon) -->
  <circle cx="11.2" cy="29" r="1.45" fill="#FFD6E6" opacity="0.88" filter="url(#exhGlow)"/>
  <circle cx="52.8" cy="29" r="1.45" fill="#FFD6E6" opacity="0.88" filter="url(#exhGlow)"/>

  <!-- Center Neri Crystalline Exclamation Mark (!) -->
  <g id="exhausted-mark" filter="url(#exhGlow)">
    <!-- Tapered diamond-crystal stem -->
    <path d="M 32,16.4 C 33.8,16.4 35.1,17.8 34.8,19.7 L 33.6,29.8 C 33.5,30.9 32.8,31.6 32,31.6 C 31.2,31.6 30.5,30.9 30.4,29.8 L 29.2,19.7 C 28.9,17.8 30.2,16.4 32,16.4 Z"
          fill="url(#exhMarkGrad)" stroke="#FFF5FA" stroke-width="0.7" stroke-linejoin="round"/>
    <!-- 4-point Neri star dot -->
    <path d="M 32,34.4 L 33.4,37.4 L 36.4,38.8 L 33.4,40.2 L 32,43.2 L 30.6,40.2 L 27.6,38.8 L 30.6,37.4 Z"
          fill="#FFF4FA" stroke="#F492B5" stroke-width="0.55" stroke-linejoin="round"/>
  </g>

  <!-- Signature mini crimson bow pendant below the ring -->
  <g transform="translate(32, 55.2)">
    <path d="M -1,1.2 L -3.1,5.2 M 1,1.2 L 3.1,5.2" stroke="#221726" stroke-width="0.95" stroke-linecap="round"/>
    <circle cx="-3.4" cy="6.2" r="1.65" fill="#1C1420" stroke="#7A6284" stroke-width="0.5"/>
    <circle cx="3.4" cy="6.2" r="1.65" fill="#1C1420" stroke="#7A6284" stroke-width="0.5"/>
    <path d="M -1,0 C -5.5,-4 -9.2,-1.8 -8.3,1.1 C -7.4,3.6 -3.8,3.2 -1,0.9 Z" fill="url(#exhCrimson)" stroke="#4A1426" stroke-width="0.65"/>
    <path d="M 1,0 C 5.5,-4 9.2,-1.8 8.3,1.1 C 7.4,3.6 3.8,3.2 1,0.9 Z" fill="url(#exhCrimson)" stroke="#4A1426" stroke-width="0.65"/>
    <rect x="-1.6" y="-1.6" width="3.2" height="3.2" rx="1.1" fill="#D43B5E" stroke="#4A1426" stroke-width="0.65"/>
  </g>
</svg>
