<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 36" width="400" height="36">
  <!-- Neri Starlight Frame: Seamless Horizontal Edge Trim (400x36) -->
  <defs>
    <linearGradient id="slEhRail" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="400" y2="10">
      <stop offset="0%" stop-color="#D4BCEB" stop-opacity="0.44"/>
      <stop offset="50%" stop-color="#FCE4F6" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#D4BCEB" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="slEhWave" gradientUnits="userSpaceOnUse" x1="0" y1="21" x2="400" y2="21">
      <stop offset="0%" stop-color="#F0C8E8" stop-opacity="0.50"/>
      <stop offset="50%" stop-color="#FFEAF8" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#F0C8E8" stop-opacity="0.50"/>
    </linearGradient>
    <radialGradient id="slEhStar" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F9B4DB"/>
      <stop offset="100%" stop-color="#C44E92"/>
    </radialGradient>
  </defs>

  <!-- Outer starry-railway rail (exact y=10) -->
  <line x1="0" y1="10" x2="400" y2="10" stroke="url(#slEhRail)" stroke-width="1.55"/>
  <!-- Inner railway stitch (exact y=17) -->
  <line x1="0" y1="17" x2="400" y2="17" stroke="#F4CCE8" stroke-opacity="0.34" stroke-width="0.9" stroke-dasharray="3 5"/>

  <!-- Seamless scalloped cape-lace wave (exact y=17 baseline, amplitude 8) -->
  <path d="M 0,17 Q 16,25 32,17 Q 48,25 64,17 Q 80,25 96,17 Q 112,25 128,17 Q 144,25 160,17 Q 176,25 192,17 Q 208,25 224,17 Q 240,25 256,17 Q 272,25 288,17 Q 304,25 320,17 Q 336,25 352,17 Q 368,25 384,17 Q 392,21 400,17"
        fill="#F8D8F0" fill-opacity="0.07" stroke="url(#slEhWave)" stroke-width="1.05"/>

  <!-- Center Starry-Railway Station Emblem (4-point crystal + twin filigree wings) -->
  <path d="M 184,10 C 189,14 194,15 200,15 C 206,15 211,14 216,10" fill="none" stroke="#FCE0F4" stroke-opacity="0.65" stroke-width="0.9"/>
  <path d="M 200,16.5 L 202.2,22.3 L 208,24.5 L 202.2,26.7 L 200,32.5 L 197.8,26.7 L 192,24.5 L 197.8,22.3 Z"
        fill="url(#slEhStar)" stroke="#FFF8FD" stroke-width="0.65"/>

  <!-- Symmetrical starlight diamonds & pearl beads -->
  <path d="M 100,20.5 L 103.5,24.5 L 100,28.5 L 96.5,24.5 Z" fill="#FCE6F6" fill-opacity="0.72" stroke="#FFFFFF" stroke-width="0.5"/>
  <path d="M 300,20.5 L 303.5,24.5 L 300,28.5 L 296.5,24.5 Z" fill="#FCE6F6" fill-opacity="0.72" stroke="#FFFFFF" stroke-width="0.5"/>

  <g fill="#FFEAF8" opacity="0.65">
    <circle cx="48" cy="21" r="1.2"/><circle cx="144" cy="21" r="1.2"/>
    <circle cx="256" cy="21" r="1.2"/><circle cx="352" cy="21" r="1.2"/>
  </g>
</svg>
