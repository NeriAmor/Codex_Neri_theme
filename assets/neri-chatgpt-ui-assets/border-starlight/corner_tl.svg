<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Neri Starlight Frame: Top-Left Corner (星空列车华框 · 银紫星轨卷草 + 羽翼星芒 + ×宝石扣) -->
  <defs>
    <linearGradient id="slTlRail" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="320" y2="320">
      <stop offset="0%" stop-color="#FFF9FD" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#F6CBEB" stop-opacity="0.72"/>
      <stop offset="72%" stop-color="#D4BCEB" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#D4BCEB" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="slTlFiligree" gradientUnits="userSpaceOnUse" x1="12" y1="12" x2="180" y2="180">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#F8B6DF" stop-opacity="0.75"/>
      <stop offset="78%" stop-color="#B98CE0" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#9A72C8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="slTlAura" cx="6%" cy="6%" r="58%">
      <stop offset="0%" stop-color="#F6A2D6" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#9B68D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#161224" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slTlGem" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#F9B4DB"/>
      <stop offset="80%" stop-color="#C44E92"/>
      <stop offset="100%" stop-color="#6B255E"/>
    </radialGradient>
    <filter id="slTlGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="320" fill="url(#slTlAura)"/>

  <!-- Double Architectural Starry-Railway Outer Frame (seam-locked at 10 & 17) -->
  <path d="M 10,320 L 10,44 C 10,22 22,10 44,10 L 320,10"
        fill="none" stroke="url(#slTlRail)" stroke-width="1.55"/>
  <path d="M 17,320 L 17,48 C 17,29 29,17 48,17 L 320,17"
        fill="none" stroke="#F4CCE8" stroke-opacity="0.34" stroke-width="0.9" stroke-dasharray="3 5"/>

  <!-- Double-layered scalloped cape-lace trim (seam-locked baseline 17, amplitude 8) -->
  <path d="M 48,17 Q 64,25 80,17 Q 96,25 112,17 Q 128,25 144,17 Q 160,25 176,17 Q 192,25 208,17 Q 224,25 240,17 Q 256,25 272,17 Q 288,25 304,17 Q 312,21 320,17"
        fill="#F8D8F0" fill-opacity="0.07" stroke="#F0C8E8" stroke-opacity="0.54" stroke-width="1.05"/>
  <path d="M 17,48 Q 25,64 17,80 Q 25,96 17,112 Q 25,128 17,144 Q 25,160 17,176 Q 25,192 17,208 Q 25,224 17,240 Q 25,256 17,272 Q 25,288 17,304 Q 21,312 17,320"
        fill="#F8D8F0" fill-opacity="0.07" stroke="#F0C8E8" stroke-opacity="0.54" stroke-width="1.05"/>

  <!-- Delicate corner filigree scrollwork hugging outer margin (keeps menu bar unobstructed) -->
  <path d="M 10,136 C 18,108 32,76 54,54 C 76,32 108,18 136,10"
        fill="none" stroke="url(#slTlFiligree)" stroke-width="1.45" stroke-linecap="round"/>
  <path d="M 17,104 C 24,80 38,56 56,38 C 74,24 88,19 104,17"
        fill="none" stroke="#FCE6F6" stroke-opacity="0.55" stroke-width="0.95" stroke-dasharray="2 3.5"/>

  <!-- Ornate corner bracket & filigree leaf curls -->
  <g fill="none" stroke="url(#slTlFiligree)" stroke-linecap="round" filter="url(#slTlGlow)">
    <!-- Outer corner diamond bracket -->
    <path d="M 10,64 C 26,60 36,48 40,36 C 48,32 60,24 64,10" stroke-width="1.2"/>
    <!-- Elegant swirling curls -->
    <path d="M 28,28 C 46,24 62,16 78,10" stroke-width="1.05"/>
    <path d="M 28,28 C 24,46 16,62 10,78" stroke-width="1.05"/>
    <!-- Subtle integrated feather-quill curve -->
    <path d="M 38,38 C 48,28 60,26 70,22 C 62,32 50,36 38,38 Z" fill="#FFF2FB" fill-opacity="0.28" stroke-width="0.85"/>
  </g>

  <!-- Corner Vertex Neri Eye-Gradient 4-Point Compass Star -->
  <g filter="url(#slTlGlow)">
    <path d="M 24,10 L 27.4,20.6 L 38,24 L 27.4,27.4 L 24,38 L 20.6,27.4 L 10,24 L 20.6,20.6 Z"
          fill="url(#slTlGem)" stroke="#FFF9FD" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="24" cy="24" r="2.2" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Subtle Neri × Jewel Clasp tucked neatly on corner diagonal -->
  <g transform="translate(52, 52) rotate(45)" filter="url(#slTlGlow)">
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#1E1329" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#1E1329" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FAD4EE" stroke-width="1.05" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#FAD4EE" stroke-width="1.05" stroke-linecap="round"/>
  </g>

  <!-- Starlight beads & mini 4-point accents -->
  <g fill="#FFF5FC">
    <path d="M 128,24 L 129.2,27.8 L 133,29 L 129.2,30.2 L 128,34 L 126.8,30.2 L 123,29 L 126.8,27.8 Z" opacity="0.86"/>
    <path d="M 29,123 L 30.2,126.8 L 34,128 L 30.2,129.2 L 29,133 L 27.8,129.2 L 24,128 L 27.8,126.8 Z" opacity="0.86"/>
    <circle cx="80" cy="21" r="1.2" opacity="0.65"/>
    <circle cx="176" cy="21" r="1.2" opacity="0.62"/>
    <circle cx="256" cy="21" r="1.2" opacity="0.58"/>
    <circle cx="21" cy="80" r="1.2" opacity="0.65"/>
    <circle cx="21" cy="176" r="1.2" opacity="0.62"/>
    <circle cx="21" cy="256" r="1.2" opacity="0.58"/>
  </g>
</svg>
