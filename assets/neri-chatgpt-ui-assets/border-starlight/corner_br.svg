<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Neri Starlight Frame: Bottom-Right Corner (星空列车华框 · 新月星轨卷草 + 星芒罗盘) -->
  <defs>
    <linearGradient id="slBrRail" gradientUnits="userSpaceOnUse" x1="310" y1="310" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFF9FD" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#F6CBEB" stop-opacity="0.72"/>
      <stop offset="72%" stop-color="#D4BCEB" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#D4BCEB" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="slBrFiligree" gradientUnits="userSpaceOnUse" x1="308" y1="308" x2="140" y2="140">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#F8B6DF" stop-opacity="0.75"/>
      <stop offset="78%" stop-color="#B98CE0" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#9A72C8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="slBrAura" cx="94%" cy="94%" r="58%">
      <stop offset="0%" stop-color="#F6A2D6" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#9B68D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#161224" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slBrGem" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#F9B4DB"/>
      <stop offset="80%" stop-color="#C44E92"/>
      <stop offset="100%" stop-color="#6B255E"/>
    </radialGradient>
    <filter id="slBrGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="320" fill="url(#slBrAura)"/>

  <!-- Double Architectural Starry-Railway Outer Frame (seam-locked at 10 & 17) -->
  <path d="M 0,310 L 276,310 C 298,310 310,298 310,276 L 310,0"
        fill="none" stroke="url(#slBrRail)" stroke-width="1.55"/>
  <path d="M 0,303 L 272,303 C 291,303 303,291 303,272 L 303,0"
        fill="none" stroke="#F4CCE8" stroke-opacity="0.34" stroke-width="0.9" stroke-dasharray="3 5"/>

  <!-- Double-layered scalloped cape-lace trim -->
  <path d="M 272,303 Q 256,295 240,303 Q 224,295 208,303 Q 192,295 176,303 Q 160,295 144,303 Q 128,295 112,303 Q 96,295 80,303 Q 64,295 48,303 Q 32,295 16,303 Q 8,299 0,303"
        fill="#F8D8F0" fill-opacity="0.07" stroke="#F0C8E8" stroke-opacity="0.54" stroke-width="1.05"/>
  <path d="M 303,272 Q 295,256 303,240 Q 295,224 303,208 Q 295,192 303,176 Q 295,160 303,144 Q 295,128 303,112 Q 295,96 303,80 Q 295,64 303,48 Q 295,32 303,16 Q 299,8 303,0"
        fill="#F8D8F0" fill-opacity="0.07" stroke="#F0C8E8" stroke-opacity="0.54" stroke-width="1.05"/>

  <!-- Delicate corner filigree scrollwork -->
  <path d="M 310,184 C 302,212 288,244 266,266 C 244,288 212,302 184,310"
        fill="none" stroke="url(#slBrFiligree)" stroke-width="1.45" stroke-linecap="round"/>
  <path d="M 303,216 C 296,240 282,264 264,282 C 246,296 232,301 216,303"
        fill="none" stroke="#FCE6F6" stroke-opacity="0.55" stroke-width="0.95" stroke-dasharray="2 3.5"/>

  <g fill="none" stroke="url(#slBrFiligree)" stroke-linecap="round" filter="url(#slBrGlow)">
    <path d="M 310,256 C 294,260 284,272 280,284 C 272,288 260,296 256,310" stroke-width="1.2"/>
    <path d="M 292,292 C 274,296 258,304 242,310" stroke-width="1.05"/>
    <path d="M 292,292 C 296,274 304,258 310,242" stroke-width="1.05"/>
  </g>

  <!-- Delicate starry crescent moon nestled on diagonal -->
  <g transform="translate(264, 264) rotate(-32)" filter="url(#slBrGlow)">
    <path d="M 2,-9 A 9.5,9.5 0 1,0 2,9 A 7.2,7.2 0 1,1 2,-9 Z"
          fill="#FCE8F7" fill-opacity="0.88" stroke="#FFFFFF" stroke-width="0.6"/>
    <circle cx="5" cy="-1" r="1.4" fill="#F9B4DB"/>
  </g>

  <!-- Corner Vertex Neri Eye-Gradient 4-Point Compass Star -->
  <g filter="url(#slBrGlow)">
    <path d="M 296,282 L 299.4,292.6 L 310,296 L 299.4,299.4 L 296,310 L 292.6,299.4 L 282,296 L 292.6,292.6 Z"
          fill="url(#slBrGem)" stroke="#FFF9FD" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="296" cy="296" r="2.2" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Starlight beads & mini 4-point accents -->
  <g fill="#FFF5FC">
    <path d="M 192,286 L 193.2,289.8 L 197,291 L 193.2,292.2 L 192,296 L 190.8,292.2 L 187,291 L 190.8,289.8 Z" opacity="0.86"/>
    <path d="M 291,187 L 292.2,190.8 L 296,192 L 292.2,193.2 L 291,197 L 289.8,193.2 L 286,192 L 289.8,190.8 Z" opacity="0.86"/>
    <circle cx="240" cy="299" r="1.2" opacity="0.65"/>
    <circle cx="144" cy="299" r="1.2" opacity="0.62"/>
    <circle cx="64" cy="299" r="1.2" opacity="0.58"/>
    <circle cx="299" cy="240" r="1.2" opacity="0.65"/>
    <circle cx="299" cy="144" r="1.2" opacity="0.62"/>
    <circle cx="299" cy="64" r="1.2" opacity="0.58"/>
  </g>
</svg>
