<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Neri Starlight Frame: Bottom-Left Corner (星空列车华框 · 银紫星轨卷草 + 绯红晶滴 + 星芒罗盘) -->
  <defs>
    <linearGradient id="slBlRail" gradientUnits="userSpaceOnUse" x1="10" y1="310" x2="320" y2="0">
      <stop offset="0%" stop-color="#FFF9FD" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#F6CBEB" stop-opacity="0.72"/>
      <stop offset="72%" stop-color="#D4BCEB" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#D4BCEB" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="slBlFiligree" gradientUnits="userSpaceOnUse" x1="12" y1="308" x2="180" y2="140">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#F692BE" stop-opacity="0.75"/>
      <stop offset="78%" stop-color="#B98CE0" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#9A72C8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="slBlAura" cx="6%" cy="94%" r="58%">
      <stop offset="0%" stop-color="#EA72A4" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#9B68D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#161224" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slBlGem" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FF96B8"/>
      <stop offset="80%" stop-color="#CF3662"/>
      <stop offset="100%" stop-color="#761734"/>
    </radialGradient>
    <filter id="slBlGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="320" fill="url(#slBlAura)"/>

  <!-- Double Architectural Starry-Railway Outer Frame (seam-locked at 10 & 17) -->
  <path d="M 10,0 L 10,276 C 10,298 22,310 44,310 L 320,310"
        fill="none" stroke="url(#slBlRail)" stroke-width="1.55"/>
  <path d="M 17,0 L 17,272 C 17,291 29,303 48,303 L 320,303"
        fill="none" stroke="#F4CCE8" stroke-opacity="0.34" stroke-width="0.9" stroke-dasharray="3 5"/>

  <!-- Double-layered scalloped cape-lace trim -->
  <path d="M 48,303 Q 64,295 80,303 Q 96,295 112,303 Q 128,295 144,303 Q 160,295 176,303 Q 192,295 208,303 Q 224,295 240,303 Q 256,295 272,303 Q 288,295 304,303 Q 312,299 320,303"
        fill="#F8D8F0" fill-opacity="0.07" stroke="#F0C8E8" stroke-opacity="0.54" stroke-width="1.05"/>
  <path d="M 17,272 Q 25,256 17,240 Q 25,224 17,208 Q 25,192 17,176 Q 25,160 17,144 Q 25,128 17,112 Q 25,96 17,80 Q 25,64 17,48 Q 25,32 17,16 Q 21,8 17,0"
        fill="#F8D8F0" fill-opacity="0.07" stroke="#F0C8E8" stroke-opacity="0.54" stroke-width="1.05"/>

  <!-- Delicate corner filigree scrollwork -->
  <path d="M 10,184 C 18,212 32,244 54,266 C 76,288 108,302 136,310"
        fill="none" stroke="url(#slBlFiligree)" stroke-width="1.45" stroke-linecap="round"/>
  <path d="M 17,216 C 24,240 38,264 56,282 C 74,296 88,301 104,303"
        fill="none" stroke="#FCE6F6" stroke-opacity="0.55" stroke-width="0.95" stroke-dasharray="2 3.5"/>

  <g fill="none" stroke="url(#slBlFiligree)" stroke-linecap="round" filter="url(#slBlGlow)">
    <path d="M 10,256 C 26,260 36,272 40,284 C 48,288 60,296 64,310" stroke-width="1.2"/>
    <path d="M 28,292 C 46,296 62,304 78,310" stroke-width="1.05"/>
    <path d="M 28,292 C 24,274 16,258 10,242" stroke-width="1.05"/>
  </g>

  <!-- Crimson-rose crystal teardrop pendant accent -->
  <g transform="translate(52, 268) rotate(-45)" filter="url(#slBlGlow)">
    <path d="M 0,-7 L 4.5,0 L 0,7 L -4.5,0 Z" fill="url(#slBlGem)" stroke="#FFE4F0" stroke-width="0.75"/>
  </g>

  <!-- Corner Vertex Neri Crimson-Rose 4-Point Compass Star -->
  <g filter="url(#slBlGlow)">
    <path d="M 24,282 L 27.4,292.6 L 38,296 L 27.4,299.4 L 24,310 L 20.6,299.4 L 10,296 L 20.6,292.6 Z"
          fill="url(#slBlGem)" stroke="#FFF9FD" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="24" cy="296" r="2.2" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Starlight beads & mini 4-point accents -->
  <g fill="#FFF5FC">
    <path d="M 128,286 L 129.2,289.8 L 133,291 L 129.2,292.2 L 128,296 L 126.8,292.2 L 123,291 L 126.8,289.8 Z" opacity="0.86"/>
    <path d="M 29,187 L 30.2,190.8 L 34,192 L 30.2,193.2 L 29,197 L 27.8,193.2 L 24,192 L 27.8,190.8 Z" opacity="0.86"/>
    <circle cx="80" cy="299" r="1.2" opacity="0.65"/>
    <circle cx="176" cy="299" r="1.2" opacity="0.62"/>
    <circle cx="256" cy="299" r="1.2" opacity="0.58"/>
    <circle cx="21" cy="240" r="1.2" opacity="0.65"/>
    <circle cx="21" cy="144" r="1.2" opacity="0.62"/>
    <circle cx="21" cy="64" r="1.2" opacity="0.58"/>
  </g>
</svg>
