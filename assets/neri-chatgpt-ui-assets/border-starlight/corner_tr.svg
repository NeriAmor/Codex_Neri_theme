<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Neri Starlight Frame: Top-Right Corner (星空列车华框 · 银紫星轨卷草 + 丝带纹饰 + 星芒罗盘) -->
  <defs>
    <linearGradient id="slTrRail" gradientUnits="userSpaceOnUse" x1="310" y1="10" x2="0" y2="320">
      <stop offset="0%" stop-color="#FFF9FD" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#F6CBEB" stop-opacity="0.72"/>
      <stop offset="72%" stop-color="#D4BCEB" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#D4BCEB" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="slTrFiligree" gradientUnits="userSpaceOnUse" x1="308" y1="12" x2="140" y2="180">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#F8B6DF" stop-opacity="0.75"/>
      <stop offset="78%" stop-color="#B98CE0" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#9A72C8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="slTrAura" cx="94%" cy="6%" r="58%">
      <stop offset="0%" stop-color="#F6A2D6" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#9B68D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#161224" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slTrGem" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#F9B4DB"/>
      <stop offset="80%" stop-color="#C44E92"/>
      <stop offset="100%" stop-color="#6B255E"/>
    </radialGradient>
    <filter id="slTrGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="320" fill="url(#slTrAura)"/>

  <!-- Double Architectural Starry-Railway Outer Frame (seam-locked at 10 & 17) -->
  <path d="M 0,10 L 276,10 C 298,10 310,22 310,44 L 310,320"
        fill="none" stroke="url(#slTrRail)" stroke-width="1.55"/>
  <path d="M 0,17 L 272,17 C 291,17 303,29 303,48 L 303,320"
        fill="none" stroke="#F4CCE8" stroke-opacity="0.34" stroke-width="0.9" stroke-dasharray="3 5"/>

  <!-- Double-layered scalloped cape-lace trim -->
  <path d="M 272,17 Q 256,25 240,17 Q 224,25 208,17 Q 192,25 176,17 Q 160,25 144,17 Q 128,25 112,17 Q 96,25 80,17 Q 64,25 48,17 Q 32,25 16,17 Q 8,21 0,17"
        fill="#F8D8F0" fill-opacity="0.07" stroke="#F0C8E8" stroke-opacity="0.54" stroke-width="1.05"/>
  <path d="M 303,48 Q 295,64 303,80 Q 295,96 303,112 Q 295,128 303,144 Q 295,160 303,176 Q 295,192 303,208 Q 295,224 303,240 Q 295,256 303,272 Q 295,288 303,304 Q 299,312 303,320"
        fill="#F8D8F0" fill-opacity="0.07" stroke="#F0C8E8" stroke-opacity="0.54" stroke-width="1.05"/>

  <!-- Delicate corner filigree scrollwork -->
  <path d="M 310,136 C 302,108 288,76 266,54 C 244,32 212,18 184,10"
        fill="none" stroke="url(#slTrFiligree)" stroke-width="1.45" stroke-linecap="round"/>
  <path d="M 303,104 C 296,80 282,56 264,38 C 246,24 232,19 216,17"
        fill="none" stroke="#FCE6F6" stroke-opacity="0.55" stroke-width="0.95" stroke-dasharray="2 3.5"/>

  <g fill="none" stroke="url(#slTrFiligree)" stroke-linecap="round" filter="url(#slTrGlow)">
    <path d="M 310,64 C 294,60 284,48 280,36 C 272,32 260,24 256,10" stroke-width="1.2"/>
    <path d="M 292,28 C 274,24 258,16 242,10" stroke-width="1.05"/>
    <path d="M 292,28 C 296,46 304,62 310,78" stroke-width="1.05"/>
    <!-- Elegant ribbon-bow filigree loop integrated into scrollwork -->
    <path d="M 268,52 C 258,42 248,44 252,54 C 256,62 264,58 268,52 Z" fill="#FFF2FB" fill-opacity="0.24" stroke-width="0.9"/>
    <path d="M 268,52 C 278,62 276,72 266,68 C 258,64 262,56 268,52 Z" fill="#FFF2FB" fill-opacity="0.24" stroke-width="0.9"/>
  </g>

  <!-- Corner Vertex Neri Eye-Gradient 4-Point Compass Star -->
  <g filter="url(#slTrGlow)">
    <path d="M 296,10 L 299.4,20.6 L 310,24 L 299.4,27.4 L 296,38 L 292.6,27.4 L 282,24 L 292.6,20.6 Z"
          fill="url(#slTrGem)" stroke="#FFF9FD" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="296" cy="24" r="2.2" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Starlight beads & mini 4-point accents -->
  <g fill="#FFF5FC">
    <path d="M 192,24 L 193.2,27.8 L 197,29 L 193.2,30.2 L 192,34 L 190.8,30.2 L 187,29 L 190.8,27.8 Z" opacity="0.86"/>
    <path d="M 291,123 L 292.2,126.8 L 296,128 L 292.2,129.2 L 291,133 L 289.8,129.2 L 286,128 L 289.8,126.8 Z" opacity="0.86"/>
    <circle cx="240" cy="21" r="1.2" opacity="0.65"/>
    <circle cx="144" cy="21" r="1.2" opacity="0.62"/>
    <circle cx="64" cy="21" r="1.2" opacity="0.58"/>
    <circle cx="299" cy="80" r="1.2" opacity="0.65"/>
    <circle cx="299" cy="176" r="1.2" opacity="0.62"/>
    <circle cx="299" cy="256" r="1.2" opacity="0.58"/>
  </g>
</svg>
