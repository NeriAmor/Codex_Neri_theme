<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Neri Composer Corner TL: Filigree Arc + White Feather + Cross Hairpin -->
  <defs>
    <linearGradient id="ctlArc" gradientUnits="userSpaceOnUse" x1="4" y1="44" x2="44" y2="4">
      <stop offset="0%" stop-color="#D7C3EC" stop-opacity="0"/>
      <stop offset="32%" stop-color="#E8CBEB" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#FFF5FC" stop-opacity="0.95"/>
      <stop offset="78%" stop-color="#E8CBEB" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#D7C3EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ctlFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7E4F4"/>
      <stop offset="100%" stop-color="#CFAFE2"/>
    </linearGradient>
    <filter id="ctlGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer corner arc hugging r=22px composer rim -->
  <path d="M 8,42 L 8,30 A 22,22 0 0,1 30,8 L 44,8"
        fill="none" stroke="url(#ctlArc)" stroke-width="1.35" stroke-linecap="round" filter="url(#ctlGlow)"/>

  <!-- Inner delicate lace hairline -->
  <path d="M 11.5,35 L 11.5,30 A 18.5,18.5 0 0,1 30,11.5 L 38,11.5"
        fill="none" stroke="#F4CCE8" stroke-opacity="0.34" stroke-width="0.8" stroke-dasharray="2.2 2.4"/>

  <!-- White feather resting delicately along the top-left curve -->
  <g transform="translate(15.5, 13.5) rotate(-36)" filter="url(#ctlGlow)">
    <path d="M -9,1.2 C -4,-3.6 3.5,-3.8 10.5,-0.5 C 5.8,2.6 -1.5,3.2 -9,1.2 Z"
          fill="url(#ctlFeather)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="0.4"/>
    <path d="M -10.5,1.6 C -3.5,0.6 3,-0.2 9.5,-0.5"
          fill="none" stroke="#B682C4" stroke-width="0.65" stroke-linecap="round"/>
  </g>

  <!-- Tiny Neri x hairpin sparkle -->
  <g transform="translate(26.5, 7.6) rotate(12)" opacity="0.92">
    <line x1="-2.2" y1="-2.2" x2="2.2" y2="2.2" stroke="#2B1D36" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="2.2" y1="-2.2" x2="-2.2" y2="2.2" stroke="#2B1D36" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-2.2" y1="-2.2" x2="2.2" y2="2.2" stroke="#F9D8EE" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="2.2" y1="-2.2" x2="-2.2" y2="2.2" stroke="#F9D8EE" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- Starlight dot -->
  <path d="M 8,24.5 L 8.8,26.6 L 10.9,27.4 L 8.8,28.2 L 8,30.3 L 7.2,28.2 L 5.1,27.4 L 7.2,26.6 Z"
        fill="#FFF5FC" opacity="0.9" filter="url(#ctlGlow)"/>
</svg>
