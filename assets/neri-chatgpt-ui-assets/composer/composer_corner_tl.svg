<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" width="96" height="72">
  <!-- Neri Composer Corner TL (96x72): Luminous White Feather + Iconic Black x Hairpin + Cape Lace -->
  <defs>
    <linearGradient id="tlArc" gradientUnits="userSpaceOnUse" x1="22" y1="54" x2="92" y2="22">
      <stop offset="0%" stop-color="#D7C3EC" stop-opacity="0"/>
      <stop offset="22%" stop-color="#F1C8E8" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#FFF7FD" stop-opacity="0.98"/>
      <stop offset="82%" stop-color="#F1C8E8" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#D7C3EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tlFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FCEAF6"/>
      <stop offset="100%" stop-color="#C9A8E2"/>
    </linearGradient>
    <radialGradient id="tlStarGem" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F9B4DB"/>
      <stop offset="100%" stop-color="#B8458B"/>
    </radialGradient>
    <filter id="tlGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer rim arc aligned to box edge (x=22, y=22, r=24) -->
  <path d="M 22,56 L 22,46 A 24,24 0 0,1 46,22 L 92,22"
        fill="none" stroke="url(#tlArc)" stroke-width="1.6" stroke-linecap="round" filter="url(#tlGlow)"/>

  <!-- Scalloped cape-lace trim along the top-left edge -->
  <path d="M 46,22 Q 53,27.5 60,22 Q 67,27.5 74,22 Q 81,27 88,22"
        fill="none" stroke="#F6CCE8" stroke-opacity="0.58" stroke-width="1.05"/>

  <!-- Inner starry dashed stitch -->
  <path d="M 26,52 L 26,46 A 20,20 0 0,1 46,26 L 78,26"
        fill="none" stroke="#F8D8EE" stroke-opacity="0.34" stroke-width="0.9" stroke-dasharray="2.4 2.6"/>

  <!-- Lush Neri White Sketchbook Feather sweeping over the top-left curve -->
  <g transform="translate(30, 22) rotate(-32)" filter="url(#tlGlow)">
    <!-- Soft outer feather silhouette with delicate notches -->
    <path d="M -21,2.2 C -14,-5.5 -2,-7.6 10,-5.4 L 8.2,-3.0 L 14.5,-4.0 C 18.8,-2.8 22.5,-0.8 25,0.6 C 18.5,4.2 8.5,6.2 -2,5.6 L -4.2,3.4 L -7.6,5.2 C -13.2,4.6 -17.5,3.5 -21,2.2 Z"
          fill="url(#tlFeather)" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="0.55"/>
    <!-- Feather rachis (quill) -->
    <path d="M -23.5,3.0 C -12,1.6 4,-0.4 23,0.4"
          fill="none" stroke="#BA84C8" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Subtle barb lines -->
    <path d="M -8,1.0 L -3,-2.5 M 1,0.2 L 6,-2.8 M -4,1.6 L 2,3.8"
          fill="none" stroke="#D7B2E2" stroke-opacity="0.65" stroke-width="0.55" stroke-linecap="round"/>
  </g>

  <!-- Iconic Neri Black x Hairpin with pearl rim -->
  <g transform="translate(52, 16.5) rotate(14)" filter="url(#tlGlow)">
    <line x1="-5.2" y1="-5.2" x2="5.2" y2="5.2" stroke="#1E1428" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="5.2" y1="-5.2" x2="-5.2" y2="5.2" stroke="#1E1428" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="-5.2" y1="-5.2" x2="5.2" y2="5.2" stroke="#FAD6EE" stroke-width="1.05" stroke-linecap="round"/>
    <line x1="5.2" y1="-5.2" x2="-5.2" y2="5.2" stroke="#FAD6EE" stroke-width="1.05" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.35" fill="#FFF7FD"/>
  </g>

  <!-- Glowing 4-point Neri eye-star on left curve -->
  <path d="M 18,36.2 L 19.6,40.4 L 23.8,42 L 19.6,43.6 L 18,47.8 L 16.4,43.6 L 12.2,42 L 16.4,40.4 Z"
        fill="url(#tlStarGem)" stroke="#FFF7FD" stroke-width="0.55" filter="url(#tlGlow)"/>
  <circle cx="64" cy="14" r="1.4" fill="#FFF2FB" opacity="0.88"/>
  <circle cx="13" cy="31" r="1.1" fill="#F4B6DC" opacity="0.8"/>
</svg>
