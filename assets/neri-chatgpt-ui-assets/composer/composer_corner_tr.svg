<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Neri Composer Corner TR: Filigree Arc + Crimson Satin Bow + Pom-Poms -->
  <defs>
    <linearGradient id="ctrArc" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="44" y2="44">
      <stop offset="0%" stop-color="#D7C3EC" stop-opacity="0"/>
      <stop offset="28%" stop-color="#E8CBEB" stop-opacity="0.72"/>
      <stop offset="52%" stop-color="#FFF5FC" stop-opacity="0.95"/>
      <stop offset="76%" stop-color="#E8CBEB" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#D7C3EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ctrBow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8EAB"/>
      <stop offset="55%" stop-color="#D63762"/>
      <stop offset="100%" stop-color="#8C1B3B"/>
    </linearGradient>
    <filter id="ctrGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer corner arc hugging r=22px composer rim -->
  <path d="M 4,8 L 18,8 A 22,22 0 0,1 40,30 L 40,42"
        fill="none" stroke="url(#ctrArc)" stroke-width="1.35" stroke-linecap="round" filter="url(#ctrGlow)"/>

  <!-- Inner delicate lace hairline -->
  <path d="M 10,11.5 L 18,11.5 A 18.5,18.5 0 0,1 36.5,30 L 36.5,35"
        fill="none" stroke="#F4CCE8" stroke-opacity="0.34" stroke-width="0.8" stroke-dasharray="2.2 2.4"/>

  <!-- Neri signature crimson bow perched on top-right curve -->
  <g transform="translate(33.2, 13.4) rotate(32)" filter="url(#ctrGlow)">
    <!-- Twin cords + dark pom-poms -->
    <path d="M -0.8,1.4 L -3.2,6.4 M 0.8,1.4 L 3.2,6.4" stroke="#E8C6E4" stroke-opacity="0.6" stroke-width="0.75" stroke-linecap="round"/>
    <circle cx="-3.4" cy="7.0" r="1.45" fill="#1F152A" stroke="#F4C5E4" stroke-opacity="0.7" stroke-width="0.45"/>
    <circle cx="3.4" cy="7.0" r="1.45" fill="#1F152A" stroke="#F4C5E4" stroke-opacity="0.7" stroke-width="0.45"/>
    <!-- Left wing -->
    <path d="M -0.5,0 C -3.8,-3.6 -7.8,-2.2 -7.2,0.8 C -6.6,3.4 -2.8,3.0 -0.5,0.7 Z"
          fill="url(#ctrBow)" stroke="#FFD8E8" stroke-opacity="0.58" stroke-width="0.48"/>
    <!-- Right wing -->
    <path d="M 0.5,0 C 3.8,-3.6 7.8,-2.2 7.2,0.8 C 6.6,3.4 2.8,3.0 0.5,0.7 Z"
          fill="url(#ctrBow)" stroke="#FFD8E8" stroke-opacity="0.58" stroke-width="0.48"/>
    <!-- Center knot -->
    <circle cx="0" cy="0.3" r="1.55" fill="#FFA4BD" stroke="#851737" stroke-width="0.45"/>
  </g>

  <!-- Subtle starlight dot -->
  <circle cx="19.5" cy="8" r="1.2" fill="#FFF4FC" opacity="0.88" filter="url(#ctrGlow)"/>
</svg>
