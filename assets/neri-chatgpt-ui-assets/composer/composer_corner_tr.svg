<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" width="96" height="72">
  <!-- Neri Composer Corner TR (96x72): Lush Crimson Satin Bow + Flowing Ribbons + Twin Black Pom-Poms -->
  <defs>
    <linearGradient id="trArc" gradientUnits="userSpaceOnUse" x1="4" y1="22" x2="74" y2="56">
      <stop offset="0%" stop-color="#D7C3EC" stop-opacity="0"/>
      <stop offset="22%" stop-color="#F1C8E8" stop-opacity="0.65"/>
      <stop offset="52%" stop-color="#FFF7FD" stop-opacity="0.98"/>
      <stop offset="80%" stop-color="#F1C8E8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7C3EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trBowMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF96B4"/>
      <stop offset="48%" stop-color="#D93864"/>
      <stop offset="100%" stop-color="#871939"/>
    </linearGradient>
    <linearGradient id="trBowTail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DF426E"/>
      <stop offset="100%" stop-color="#7E1635"/>
    </linearGradient>
    <radialGradient id="trPom" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4A3658"/>
      <stop offset="55%" stop-color="#22162C"/>
      <stop offset="100%" stop-color="#120B18"/>
    </radialGradient>
    <filter id="trGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer rim arc aligned to box edge (x=74, y=22, r=24) -->
  <path d="M 4,22 L 50,22 A 24,24 0 0,1 74,46 L 74,56"
        fill="none" stroke="url(#trArc)" stroke-width="1.6" stroke-linecap="round" filter="url(#trGlow)"/>

  <!-- Scalloped cape-lace trim along the top-right edge -->
  <path d="M 8,22 Q 15,27 22,22 Q 29,27.5 36,22 Q 43,27.5 50,22"
        fill="none" stroke="#F6CCE8" stroke-opacity="0.58" stroke-width="1.05"/>

  <!-- Inner starry dashed stitch -->
  <path d="M 18,26 L 50,26 A 20,20 0 0,1 70,46 L 70,52"
        fill="none" stroke="#F8D8EE" stroke-opacity="0.34" stroke-width="0.9" stroke-dasharray="2.4 2.6"/>

  <!-- Signature Lush Neri Crimson Bow + Twin Black Pom-Poms perched on top-right corner -->
  <g transform="translate(73.5, 21.5) rotate(26)" filter="url(#trGlow)">
    <!-- Flowing crimson ribbon tails -->
    <path d="M -2,3 C -4.2,9.5 -7.5,14.5 -10.0,18.2 L -6.0,16.4 L -3.8,19.4 C -2.0,14.6 -0.6,9.2 0.2,3.5 Z"
          fill="url(#trBowTail)" stroke="#FFC4D8" stroke-opacity="0.45" stroke-width="0.5"/>
    <path d="M 2,3 C 5.0,9.5 8.2,14.5 10.6,18.2 L 6.5,16.4 L 4.2,19.6 C 2.2,14.8 0.8,9.2 -0.2,3.5 Z"
          fill="url(#trBowTail)" stroke="#FFC4D8" stroke-opacity="0.45" stroke-width="0.5"/>

    <!-- Twin delicate cords & fluffy black pom-poms -->
    <path d="M -1.5,3.5 Q -4.8,12 -7.0,20.5" fill="none" stroke="#F2CBE6" stroke-opacity="0.72" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 1.5,3.5 Q 5.2,12 7.6,21.0" fill="none" stroke="#F2CBE6" stroke-opacity="0.72" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="-7.3" cy="21.8" r="3.1" fill="url(#trPom)" stroke="#F6C8E6" stroke-opacity="0.75" stroke-width="0.75"/>
    <circle cx="7.9" cy="22.2" r="3.1" fill="url(#trPom)" stroke="#F6C8E6" stroke-opacity="0.75" stroke-width="0.75"/>

    <!-- Left bow loop -->
    <path d="M -1,0 C -8.5,-9.2 -17.8,-6.0 -16.4,2.0 C -15.2,8.8 -7.2,7.6 -1,1.8 Z"
          fill="url(#trBowMain)" stroke="#FFDCEB" stroke-opacity="0.65" stroke-width="0.65"/>
    <!-- Left inner crease -->
    <path d="M -2.5,0.6 C -6.8,-2.2 -10.8,-1.2 -11.5,1.2" fill="none" stroke="#6B102B" stroke-opacity="0.55" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Right bow loop -->
    <path d="M 1,0 C 8.5,-9.2 17.8,-6.0 16.4,2.0 C 15.2,8.8 7.2,7.6 1,1.8 Z"
          fill="url(#trBowMain)" stroke="#FFDCEB" stroke-opacity="0.65" stroke-width="0.65"/>
    <!-- Right inner crease -->
    <path d="M 2.5,0.6 C 6.8,-2.2 10.8,-1.2 11.5,1.2" fill="none" stroke="#6B102B" stroke-opacity="0.55" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Satin center knot -->
    <rect x="-3.4" y="-3.2" width="6.8" height="6.8" rx="2.4"
          fill="#FF8CAE" stroke="#7A1332" stroke-width="0.7"/>
    <circle cx="-0.8" cy="-0.8" r="1.1" fill="#FFF0F6" opacity="0.75"/>
  </g>

  <!-- Starlight sparkles -->
  <path d="M 46,11.4 L 47.2,14.6 L 50.4,15.8 L 47.2,17.0 L 46,20.2 L 44.8,17.0 L 41.6,15.8 L 44.8,14.6 Z"
        fill="#FFF6FD" opacity="0.92" filter="url(#trGlow)"/>
  <circle cx="84" cy="14" r="1.3" fill="#FAD2EA" opacity="0.85"/>
</svg>
