<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Neri Composer Corner BL: Filigree Arc + Starlight Sparkle -->
  <defs>
    <linearGradient id="cblArc" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="44" y2="44">
      <stop offset="0%" stop-color="#D7C3EC" stop-opacity="0"/>
      <stop offset="30%" stop-color="#E8CBEB" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#FFF5FC" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#E8CBEB" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#D7C3EC" stop-opacity="0"/>
    </linearGradient>
    <filter id="cblGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.0" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer corner arc hugging r=22px composer rim -->
  <path d="M 8,6 L 8,18 A 22,22 0 0,0 30,40 L 44,40"
        fill="none" stroke="url(#cblArc)" stroke-width="1.35" stroke-linecap="round" filter="url(#cblGlow)"/>

  <!-- Inner delicate lace hairline -->
  <path d="M 11.5,13 L 11.5,18 A 18.5,18.5 0 0,0 30,36.5 L 38,36.5"
        fill="none" stroke="#F4CCE8" stroke-opacity="0.3" stroke-width="0.8" stroke-dasharray="2.2 2.4"/>

  <!-- 4-point starlight accent at bottom-left bend -->
  <path d="M 14.4,29.8 L 15.6,32.6 L 18.4,33.8 L 15.6,35.0 L 14.4,37.8 L 13.2,35.0 L 10.4,33.8 L 13.2,32.6 Z"
        fill="#FFF6FD" opacity="0.92" filter="url(#cblGlow)"/>
  <circle cx="22.5" cy="38.5" r="1.15" fill="#F6C2E4" opacity="0.82"/>
</svg>
