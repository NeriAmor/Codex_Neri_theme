<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" width="96" height="72">
  <!-- Neri Composer Corner BL (96x72): White Satin Bow + Starry Eye-Crystal + Cape Lace -->
  <defs>
    <linearGradient id="blArc" gradientUnits="userSpaceOnUse" x1="22" y1="16" x2="92" y2="50">
      <stop offset="0%" stop-color="#D7C3EC" stop-opacity="0"/>
      <stop offset="22%" stop-color="#F1C8E8" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#FFF7FD" stop-opacity="0.96"/>
      <stop offset="82%" stop-color="#F1C8E8" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#D7C3EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blWhiteBow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F9E5F4"/>
      <stop offset="100%" stop-color="#C8B0E2"/>
    </linearGradient>
    <radialGradient id="blStarGem" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F9B4DB"/>
      <stop offset="100%" stop-color="#B04084"/>
    </radialGradient>
    <filter id="blGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer rim arc aligned to box edge (x=22, y=50, r=24) -->
  <path d="M 22,16 L 22,26 A 24,24 0 0,0 46,50 L 92,50"
        fill="none" stroke="url(#blArc)" stroke-width="1.6" stroke-linecap="round" filter="url(#blGlow)"/>

  <!-- Scalloped cape-lace under-frill along bottom-left -->
  <path d="M 46,50 Q 53,55.5 60,50 Q 67,55.5 74,50 Q 81,55 88,50"
        fill="none" stroke="#F4C6E6" stroke-opacity="0.54" stroke-width="1.05"/>

  <!-- Inner starry dashed stitch -->
  <path d="M 26,20 L 26,26 A 20,20 0 0,0 46,46 L 78,46"
        fill="none" stroke="#F8D8EE" stroke-opacity="0.32" stroke-width="0.9" stroke-dasharray="2.4 2.6"/>

  <!-- Neri's Large White Satin Bow accent at bottom-left corner -->
  <g transform="translate(26.5, 46.5) rotate(36)" filter="url(#blGlow)">
    <!-- Ribbon tails -->
    <path d="M -1.5,2 L -6.5,11.5 L -2.8,9.8 L 0.2,2.5 Z" fill="#E3D2F0"/>
    <path d="M 1.5,2 L 6.5,11.5 L 2.8,9.8 L -0.2,2.5 Z" fill="#F4E4F7"/>
    <!-- Left white loop -->
    <path d="M -0.8,0 C -6.5,-6.8 -13.4,-4.4 -12.4,1.6 C -11.4,6.6 -5.4,5.8 -0.8,1.4 Z"
          fill="url(#blWhiteBow)" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="0.55"/>
    <!-- Right white loop -->
    <path d="M 0.8,0 C 6.5,-6.8 13.4,-4.4 12.4,1.6 C 11.4,6.6 5.4,5.8 0.8,1.4 Z"
          fill="url(#blWhiteBow)" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="0.55"/>
    <!-- Rose-pink gem knot -->
    <circle cx="0" cy="0.4" r="2.5" fill="url(#blStarGem)" stroke="#FFFFFF" stroke-width="0.55"/>
  </g>

  <!-- Glowing 4-point starlight crystal -->
  <path d="M 46,54.2 L 47.2,57.4 L 50.4,58.6 L 47.2,59.8 L 46,63.0 L 44.8,59.8 L 41.6,58.6 L 44.8,57.4 Z"
        fill="#FFF6FD" opacity="0.92" filter="url(#blGlow)"/>
  <circle cx="15" cy="34" r="1.25" fill="#F6C4E6" opacity="0.85"/>
</svg>
