<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 28" width="380" height="28">
  <!-- Neri Composer Top Center Crown (380x28): Sweeping Cape-Lace + Eye-Crystal Star + Winged Filigree -->
  <defs>
    <linearGradient id="tcLine" gradientUnits="userSpaceOnUse" x1="8" y1="14" x2="372" y2="14">
      <stop offset="0%" stop-color="#D7C3EC" stop-opacity="0"/>
      <stop offset="18%" stop-color="#F0C6E8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#FFF7FD" stop-opacity="0.98"/>
      <stop offset="82%" stop-color="#F0C6E8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#D7C3EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tcLace" gradientUnits="userSpaceOnUse" x1="28" y1="14" x2="352" y2="14">
      <stop offset="0%" stop-color="#F2B0D8" stop-opacity="0"/>
      <stop offset="22%" stop-color="#F6BCE0" stop-opacity="0.58"/>
      <stop offset="50%" stop-color="#FFE8F6" stop-opacity="0.92"/>
      <stop offset="78%" stop-color="#F6BCE0" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#F2B0D8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tcGem" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F9B4DB"/>
      <stop offset="78%" stop-color="#C84E94"/>
      <stop offset="100%" stop-color="#762864"/>
    </radialGradient>
    <filter id="tcGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main starlight rail aligned on y=14 -->
  <line x1="8" y1="14" x2="162" y2="14" stroke="url(#tcLine)" stroke-width="1.2"/>
  <line x1="218" y1="14" x2="372" y2="14" stroke="url(#tcLine)" stroke-width="1.2"/>

  <!-- Rich scalloped cape-hem lace waves tangent to y=14 -->
  <path d="M 32,14 Q 44,21.5 56,14 Q 68,21.5 80,14 Q 92,21.5 104,14 Q 116,21.5 128,14 Q 140,21.5 152,14"
        fill="none" stroke="url(#tcLace)" stroke-width="1.15"/>
  <path d="M 228,14 Q 240,21.5 252,14 Q 264,21.5 276,14 Q 288,21.5 300,14 Q 312,21.5 324,14 Q 336,21.5 348,14"
        fill="none" stroke="url(#tcLace)" stroke-width="1.15"/>

  <!-- Tiny pearl beads nestled in lace scallops -->
  <circle cx="80" cy="18.2" r="1.0" fill="#FFE8F6" opacity="0.72"/>
  <circle cx="104" cy="18.2" r="1.1" fill="#FFE8F6" opacity="0.82"/>
  <circle cx="128" cy="18.2" r="1.2" fill="#FFE8F6" opacity="0.9"/>
  <circle cx="252" cy="18.2" r="1.2" fill="#FFE8F6" opacity="0.9"/>
  <circle cx="276" cy="18.2" r="1.1" fill="#FFE8F6" opacity="0.82"/>
  <circle cx="300" cy="18.2" r="1.0" fill="#FFE8F6" opacity="0.72"/>

  <!-- Delicate feather-like tiara curls flanking center star -->
  <path d="M 176,14 C 169,8.5 161,7.5 153,11.2 C 161,12.2 167,13.5 174,14 Z"
        fill="#FCEAF7" opacity="0.78"/>
  <path d="M 204,14 C 211,8.5 219,7.5 227,11.2 C 219,12.2 213,13.5 206,14 Z"
        fill="#FCEAF7" opacity="0.78"/>

  <!-- Center Neri Eye-Gradient 4-Point Starlight Crystal -->
  <g filter="url(#tcGlow)">
    <path d="M 190,2.8 L 193.2,10.8 L 201.2,14 L 193.2,17.2 L 190,25.2 L 186.8,17.2 L 178.8,14 L 186.8,10.8 Z"
          fill="url(#tcGem)" stroke="#FFF8FD" stroke-width="0.85" stroke-linejoin="round"/>
    <circle cx="190" cy="14" r="1.9" fill="#FFFFFF" opacity="0.94"/>
  </g>
</svg>
