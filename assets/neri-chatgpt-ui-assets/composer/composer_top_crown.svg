<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 18" width="260" height="18">
  <!-- Neri Composer Top Center Lace Crown & 4-Point Star -->
  <defs>
    <linearGradient id="ctcLine" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="260" y2="9">
      <stop offset="0%" stop-color="#D7C3EC" stop-opacity="0"/>
      <stop offset="22%" stop-color="#EBC8EB" stop-opacity="0.52"/>
      <stop offset="50%" stop-color="#FFF4FC" stop-opacity="0.92"/>
      <stop offset="78%" stop-color="#EBC8EB" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#D7C3EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ctcWave" gradientUnits="userSpaceOnUse" x1="20" y1="9" x2="240" y2="9">
      <stop offset="0%" stop-color="#F2B0D8" stop-opacity="0"/>
      <stop offset="28%" stop-color="#F6BCE0" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#FFE4F4" stop-opacity="0.78"/>
      <stop offset="72%" stop-color="#F6BCE0" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#F2B0D8" stop-opacity="0"/>
    </linearGradient>
    <filter id="ctcGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crisp starlight hairline aligned on y=9 -->
  <line x1="6" y1="9" x2="112" y2="9" stroke="url(#ctcLine)" stroke-width="1"/>
  <line x1="148" y1="9" x2="254" y2="9" stroke="url(#ctcLine)" stroke-width="1"/>

  <!-- Delicate scalloped lace wave tangent to y=9 -->
  <path d="M 32,9 Q 44,14.8 56,9 Q 68,14.8 80,9 Q 92,14.8 104,9"
        fill="none" stroke="url(#ctcWave)" stroke-width="0.9"/>
  <path d="M 156,9 Q 168,14.8 180,9 Q 192,14.8 204,9 Q 216,14.8 228,9"
        fill="none" stroke="url(#ctcWave)" stroke-width="0.9"/>

  <!-- Center 4-point Neri starlight emblem -->
  <path d="M 130,2.2 L 131.9,7.1 L 136.8,9 L 131.9,10.9 L 130,15.8 L 128.1,10.9 L 123.2,9 L 128.1,7.1 Z"
        fill="#FFF7FD" filter="url(#ctcGlow)"/>
  <circle cx="116" cy="9" r="1.25" fill="#F6C0E2" opacity="0.85"/>
  <circle cx="144" cy="9" r="1.25" fill="#F6C0E2" opacity="0.85"/>
</svg>
