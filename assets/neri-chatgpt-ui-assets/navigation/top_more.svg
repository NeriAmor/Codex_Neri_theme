<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Neri Top-Right Icon 1: More (三星连珠) -->
  <defs>
    <radialGradient id="moreStar" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAB8DF"/>
      <stop offset="100%" stop-color="#C964AE"/>
    </radialGradient>
    <radialGradient id="moreDot" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E8D8F5"/>
      <stop offset="100%" stop-color="#B096D0"/>
    </radialGradient>
    <filter id="moreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left pearl dot -->
  <circle cx="7.8" cy="16" r="2.2" fill="url(#moreDot)" filter="url(#moreGlow)"/>
  <!-- Center 4-point Neri star -->
  <path d="M 16,11.4 L 17.3,14.7 L 20.6,16 L 17.3,17.3 L 16,20.6 L 14.7,17.3 L 11.4,16 L 14.7,14.7 Z"
        fill="url(#moreStar)" filter="url(#moreGlow)"/>
  <!-- Right pearl dot -->
  <circle cx="24.2" cy="16" r="2.2" fill="url(#moreDot)" filter="url(#moreGlow)"/>
</svg>
