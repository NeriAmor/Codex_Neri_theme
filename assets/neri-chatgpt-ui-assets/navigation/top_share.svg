<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Neri Top-Right Icon 2: Share / Export (星夜分享) -->
  <defs>
    <linearGradient id="shareTray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7ECFA"/>
      <stop offset="60%" stop-color="#DEC8EE"/>
      <stop offset="100%" stop-color="#AC8ED2"/>
    </linearGradient>
    <linearGradient id="shareArrow" gradientUnits="userSpaceOnUse" x1="16" y1="20" x2="16" y2="7">
      <stop offset="0%" stop-color="#D972B5"/>
      <stop offset="55%" stop-color="#FABCE0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shareGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Bottom tray -->
  <path d="M 7.2,17.5 L 7.2,22.2 C 7.2,24 8.6,25.4 10.4,25.4 L 21.6,25.4 C 23.4,25.4 24.8,24 24.8,22.2 L 24.8,17.5"
        fill="none" stroke="url(#shareTray)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upward arrow -->
  <g filter="url(#shareGlow)">
    <line x1="16" y1="19.6" x2="16" y2="7.8" stroke="url(#shareArrow)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 11.4,12.2 L 16,7.4 L 20.6,12.2"
          fill="none" stroke="url(#shareArrow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tiny starlight spark near arrow tip -->
  <circle cx="22.4" cy="7.6" r="1.2" fill="#FFF5FC" filter="url(#shareGlow)"/>
</svg>
