<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Neri Sidebar Icon: Explore / Skills (星轨星旋) -->
  <defs>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F6C8E4"/>
      <stop offset="100%" stop-color="#B98CE0"/>
    </linearGradient>
    <radialGradient id="orbCore" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F9B4DB"/>
      <stop offset="100%" stop-color="#B94B92"/>
    </radialGradient>
    <filter id="orbGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer starry swirl ring (echoes original spiral icon silhouette) -->
  <path d="M 22.8,9.8 A 9.6,9.6 0 1,0 25.4,17.8 C 25.6,14.8 23.6,12.2 20.6,11.6"
        fill="none" stroke="url(#orbGrad)" stroke-width="1.8" stroke-linecap="round" filter="url(#orbGlow)"/>

  <!-- Inner starry crescent / orbit tail -->
  <path d="M 10.6,14.2 A 5.8,5.8 0 0,1 19.6,11.4"
        fill="none" stroke="#F8D2EA" stroke-opacity="0.7" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Center Neri 4-point star spark -->
  <path d="M 16,11.4 L 17.3,14.7 L 20.6,16 L 17.3,17.3 L 16,20.6 L 14.7,17.3 L 11.4,16 L 14.7,14.7 Z"
        fill="url(#orbCore)" filter="url(#orbGlow)"/>

  <!-- Tiny orbiting star dot -->
  <circle cx="24.2" cy="8.4" r="1.4" fill="#FFF5FC" filter="url(#orbGlow)"/>
</svg>
