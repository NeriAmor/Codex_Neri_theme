<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Neri Sidebar Icon: Tasks / Schedule (星轨日程本) -->
  <defs>
    <linearGradient id="calStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F5CCE6"/>
      <stop offset="100%" stop-color="#B996DC"/>
    </linearGradient>
    <linearGradient id="calFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48355B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#271D36" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAB8DF"/>
      <stop offset="100%" stop-color="#DE6DB2"/>
    </linearGradient>
    <filter id="calGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Calendar body -->
  <rect x="6" y="7.8" width="20" height="18.6" rx="4"
        fill="url(#calFill)" stroke="url(#calStroke)" stroke-width="1.6" filter="url(#calGlow)"/>

  <!-- Top divider line -->
  <line x1="6.8" y1="13" x2="25.2" y2="13" stroke="#E8D8F5" stroke-opacity="0.45" stroke-width="1.2"/>

  <!-- Top binder pins (crimson-berry accents like Neri's ribbon) -->
  <rect x="10.2" y="4.8" width="2.4" height="5" rx="1.2" fill="#E46488" stroke="#FFF0F7" stroke-width="0.4"/>
  <rect x="19.4" y="4.8" width="2.4" height="5" rx="1.2" fill="#E46488" stroke="#FFF0F7" stroke-width="0.4"/>

  <!-- Luminous checkmark -->
  <path d="M 11.4,19.4 L 14.7,22.4 L 20.8,16.4"
        fill="none" stroke="url(#checkGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#calGlow)"/>

  <!-- Tiny star dot -->
  <circle cx="21.4" cy="22.4" r="1" fill="#FFF3FA" opacity="0.85"/>
</svg>
