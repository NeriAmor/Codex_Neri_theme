<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Neri Sidebar Icon: Home (星夜小屋) -->
  <defs>
    <linearGradient id="homeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F6E5F4"/>
      <stop offset="100%" stop-color="#D2C2E6"/>
    </linearGradient>
    <radialGradient id="homeWindow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFE6F4"/>
      <stop offset="55%" stop-color="#DF6CB0"/>
      <stop offset="100%" stop-color="#762C6C"/>
    </radialGradient>
    <filter id="homeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cozy starry cottage silhouette -->
  <path d="M 16,5.2 L 5.2,14.4 C 4.5,15 4.9,16.1 5.8,16.1 L 7.6,16.1 L 7.6,24.4 C 7.6,25.7 8.7,26.8 10,26.8 L 22,26.8 C 23.3,26.8 24.4,25.7 24.4,24.4 L 24.4,16.1 L 26.2,16.1 C 27.1,16.1 27.5,15 26.8,14.4 Z"
        fill="url(#homeBody)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.6" filter="url(#homeGlow)"/>

  <!-- Glowing Neri eye-gradient arched window / door -->
  <path d="M 12.6,26.8 L 12.6,19.4 C 12.6,17.5 14.1,16 16,16 C 17.9,16 19.4,17.5 19.4,19.4 L 19.4,26.8 Z"
        fill="url(#homeWindow)"/>

  <!-- Tiny 4-point star inside the gable -->
  <path d="M 16,9.4 L 16.7,11.3 L 18.6,12 L 16.7,12.7 L 16,14.6 L 15.3,12.7 L 13.4,12 L 15.3,11.3 Z"
        fill="#B64B8B"/>

  <!-- Tiny sparkle above roof -->
  <path d="M 25.4,5.6 L 26,7.4 L 27.8,8 L 26,8.6 L 25.4,10.4 L 24.8,8.6 L 23,8 L 24.8,7.4 Z"
        fill="#FFF5FC" filter="url(#homeGlow)"/>
</svg>
