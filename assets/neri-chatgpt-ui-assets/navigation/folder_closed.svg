<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Neri Project Folder: Closed / Collapsed (折叠文件夹) -->
  <defs>
    <linearGradient id="fCloseFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B4470" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#2E213E" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="fCloseEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7ECFA"/>
      <stop offset="55%" stop-color="#D8C3EC"/>
      <stop offset="100%" stop-color="#A68AC9"/>
    </linearGradient>
  </defs>

  <!-- Closed folder silhouette -->
  <path d="M 4.6,10.2 C 4.6,8.6 5.9,7.4 7.5,7.4 L 12.3,7.4 C 13.2,7.4 14,7.9 14.5,8.6 L 15.8,10.4 L 24.8,10.4 C 26.3,10.4 27.4,11.6 27.4,13 L 27.4,23.2 C 27.4,24.7 26.2,25.8 24.7,25.8 L 7.3,25.8 C 5.8,25.8 4.6,24.6 4.6,23.1 Z"
        fill="url(#fCloseFill)" stroke="url(#fCloseEdge)" stroke-width="1.45" stroke-linejoin="round"/>

  <!-- Subtle top seam -->
  <line x1="5.6" y1="13.2" x2="26.4" y2="13.2" stroke="#E9DCF6" stroke-opacity="0.32" stroke-width="1.1"/>

  <!-- Tiny Neri "×" hairpin accent on folder tab -->
  <g transform="translate(9.6, 10.2) rotate(-10)">
    <line x1="-2.1" y1="-1.5" x2="2.1" y2="1.5" stroke="#F8D2EA" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-2.1" y1="1.5" x2="2.1" y2="-1.5" stroke="#F8D2EA" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Subtle pink-lavender star dot on front -->
  <path d="M 16,16.8 L 16.7,18.7 L 18.6,19.4 L 16.7,20.1 L 16,22 L 15.3,20.1 L 13.4,19.4 L 15.3,18.7 Z"
        fill="#E9B8DC" opacity="0.72"/>
</svg>
