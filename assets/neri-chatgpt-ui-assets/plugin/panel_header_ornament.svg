<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 20" width="640" height="20" preserveAspectRatio="xMidYMid slice">
  <!-- Neri Floating Panel Top Lace & Starlight Accent -->
  <defs>
    <linearGradient id="laceLine" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="640" y2="10">
      <stop offset="0%" stop-color="#D7C3EC" stop-opacity="0"/>
      <stop offset="18%" stop-color="#E8C7E8" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#FFF2FB" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#E8C7E8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#D7C3EC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laceWave" gradientUnits="userSpaceOnUse" x1="40" y1="10" x2="600" y2="10">
      <stop offset="0%" stop-color="#E6A9D2" stop-opacity="0"/>
      <stop offset="25%" stop-color="#F4B6DC" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFD8EE" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#F4B6DC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E6A9D2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Hairline horizontal rail -->
  <line x1="0" y1="7" x2="296" y2="7" stroke="url(#laceLine)" stroke-width="1"/>
  <line x1="344" y1="7" x2="640" y2="7" stroke="url(#laceLine)" stroke-width="1"/>

  <!-- Subtle scalloped lace under-wave -->
  <path d="M 60,7 Q 80,14 100,7 Q 120,14 140,7 Q 160,14 180,7 Q 200,14 220,7 Q 240,14 260,7 Q 278,13 296,7"
        fill="none" stroke="url(#laceWave)" stroke-width="0.9"/>
  <path d="M 344,7 Q 362,13 380,7 Q 400,14 420,7 Q 440,14 460,7 Q 480,14 500,7 Q 520,14 540,7 Q 560,14 580,7"
        fill="none" stroke="url(#laceWave)" stroke-width="0.9"/>

  <!-- Center 4-point star emblem -->
  <path d="M 320,1.5 L 321.5,5.5 L 325.5,7 L 321.5,8.5 L 320,12.5 L 318.5,8.5 L 314.5,7 L 318.5,5.5 Z"
        fill="#FFF5FC" opacity="0.92"/>
  <circle cx="305" cy="7" r="1.2" fill="#F4B8DC" opacity="0.75"/>
  <circle cx="335" cy="7" r="1.2" fill="#F4B8DC" opacity="0.75"/>
</svg>
