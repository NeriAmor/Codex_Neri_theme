<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Neri Plugin Icon (Alternate): Starry Crest + Crimson Bow + Pom-Poms -->
  <defs>
    <linearGradient id="nbRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5C9E6"/>
      <stop offset="100%" stop-color="#B692DA"/>
    </linearGradient>
    <radialGradient id="nbCore" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#583A70" stop-opacity="0.92"/>
      <stop offset="65%" stop-color="#2D1E42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1B132B" stop-opacity="0.96"/>
    </radialGradient>
    <linearGradient id="nbBow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF91AE"/>
      <stop offset="55%" stop-color="#D83A64"/>
      <stop offset="100%" stop-color="#921D3F"/>
    </linearGradient>
    <filter id="nbGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.95" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer starry crest circle -->
  <circle cx="16" cy="16" r="11.4" fill="url(#nbCore)" stroke="url(#nbRing)" stroke-width="1.5" filter="url(#nbGlow)"/>
  <!-- Inner delicate lace ring -->
  <circle cx="16" cy="16" r="9.2" fill="none" stroke="#E9C7E6" stroke-opacity="0.32" stroke-width="0.7" stroke-dasharray="1.8 1.8"/>

  <!-- Top glowing 4-point Neri star -->
  <path d="M 16,7.6 L 17.2,10.8 L 20.4,12 L 17.2,13.2 L 16,16.4 L 14.8,13.2 L 11.6,12 L 14.8,10.8 Z"
        fill="#FFF7FD" filter="url(#nbGlow)"/>

  <!-- Neri crimson chest bow with twin black pom-poms -->
  <g transform="translate(16, 19.6)">
    <!-- Twin cords -->
    <path d="M -0.8,0.8 Q -2.2,3.4 -3.1,4.8" fill="none" stroke="#E8C6E4" stroke-opacity="0.65" stroke-width="0.75" stroke-linecap="round"/>
    <path d="M 0.8,0.8 Q 2.2,3.4 3.1,4.8" fill="none" stroke="#E8C6E4" stroke-opacity="0.65" stroke-width="0.75" stroke-linecap="round"/>
    <!-- Twin dark pom-poms -->
    <circle cx="-3.3" cy="5.0" r="1.35" fill="#23182E" stroke="#F4C5E4" stroke-opacity="0.65" stroke-width="0.5"/>
    <circle cx="3.3" cy="5.0" r="1.35" fill="#23182E" stroke="#F4C5E4" stroke-opacity="0.65" stroke-width="0.5"/>
    <!-- Bow wings -->
    <path d="M -0.5,0 C -3.6,-3.2 -7.4,-2.0 -6.8,0.8 C -6.2,3.2 -2.8,2.8 -0.5,0.6 Z"
          fill="url(#nbBow)" stroke="#FFD8E8" stroke-opacity="0.55" stroke-width="0.5"/>
    <path d="M 0.5,0 C 3.6,-3.2 7.4,-2.0 6.8,0.8 C 6.2,3.2 2.8,2.8 0.5,0.6 Z"
          fill="url(#nbBow)" stroke="#FFD8E8" stroke-opacity="0.55" stroke-width="0.5"/>
    <!-- Bow knot -->
    <circle cx="0" cy="0.3" r="1.5" fill="#FFA3BC" stroke="#8C1A3C" stroke-width="0.45"/>
  </g>

  <!-- Corner starlight sparkles -->
  <circle cx="9.8" cy="11.2" r="0.8" fill="#FAD4EC" opacity="0.85"/>
  <circle cx="22.4" cy="11.6" r="0.7" fill="#E4CBF6" opacity="0.8"/>
</svg>
