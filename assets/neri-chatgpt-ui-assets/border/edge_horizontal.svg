<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 36" width="400" height="36">
  <!-- Neri Seamless Horizontal Edge Trim (repeat-x for top & bottom edges) -->
  <defs>
    <linearGradient id="ehGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C2EC" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#F7DAF0" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#D8C2EC" stop-opacity="0.32"/>
    </linearGradient>
  </defs>
  <!-- Fine railway line -->
  <line x1="0" y1="10" x2="400" y2="10" stroke="url(#ehGrad)" stroke-width="1.2"/>
  <line x1="0" y1="17" x2="400" y2="17" stroke="#D8C2EC" stroke-opacity="0.24" stroke-width="0.8" stroke-dasharray="3 7"/>
  <!-- Gentle scalloped cape-lace wave -->
  <path d="M 0,17 Q 20,25 40,17 Q 60,25 80,17 Q 100,25 120,17 Q 140,25 160,17 Q 180,25 200,17 Q 220,25 240,17 Q 260,25 280,17 Q 300,25 320,17 Q 340,25 360,17 Q 380,25 400,17"
        fill="none" stroke="url(#ehGrad)" stroke-width="0.9"/>
  <!-- Center tiny 4-point star & subtle × stitches -->
  <path d="M 200,19 L 201,23 L 205,24 L 201,25 L 200,29 L 199,25 L 195,24 L 199,23 Z" fill="#FFF3FC" opacity="0.65"/>
  <g stroke="#F2CBE6" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round">
    <line x1="97" y1="21" x2="103" y2="26"/>
    <line x1="97" y1="26" x2="103" y2="21"/>
    <line x1="297" y1="21" x2="303" y2="26"/>
    <line x1="297" y1="26" x2="303" y2="21"/>
  </g>
  <circle cx="40" cy="24" r="1" fill="#F8E6FF" opacity="0.45"/>
  <circle cx="160" cy="24" r="1" fill="#F8E6FF" opacity="0.45"/>
  <circle cx="240" cy="24" r="1" fill="#F8E6FF" opacity="0.45"/>
  <circle cx="360" cy="24" r="1" fill="#F8E6FF" opacity="0.45"/>
</svg>
