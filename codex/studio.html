<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism · Codex 壁纸</title><link rel="stylesheet" href="/studio.css"><script src="/studio.js" defer></script></head><body>
<header><div><h1>Prism</h1><p>Codex 桌面壁纸</p></div><button id="refresh">重新扫描</button><button id="power">启用壁纸</button><button id="restore">恢复原界面</button></header>
<p id="status" role="status">正在连接…</p><p id="error" role="alert"></p>
<section class="settings"><label>玻璃不透明度 <input id="opacity" type="range" min="0.2" max="0.98" step="0.01"><output id="opacity-value"></output></label><label>模糊 <input id="blur" type="range" min="0" max="40" step="1"></label><label>填充 <select id="fit"><option value="cover">铺满</option><option value="contain">完整显示</option><option value="fill">拉伸</option><option value="center">居中</option></select></label><label><input id="paused" type="checkbox">暂停视频</label><label><input id="audio" type="checkbox">视频声音</label><button id="next">下一张</button></section>
<section class="settings"><label><input id="rotation" type="checkbox">自动轮换</label><label>间隔（分钟）<input id="interval" type="number" min="1" max="1440" value="15"></label><label>顺序<select id="order"><option value="random">随机</option><option value="sequence">依次</option></select></label><label>切换时机<select id="trigger"><option value="interval">定时</option><option value="videoEnd">视频结束</option></select></label></section>
<section class="imports"><label class="upload">导入图片或视频<input id="upload" type="file" accept="image/*,video/*"></label><form id="folders"><input id="folder" placeholder="本地壁纸文件夹，例如 E:\Wallpapers" aria-label="本地壁纸文件夹"><button>添加文件夹</button></form></section>
<div class="filters"><input id="search" placeholder="搜索壁纸" aria-label="搜索壁纸"><select id="kind"><option value="">全部类型</option><option value="image">图片</option><option value="video">视频</option><option value="slideshow">轮播</option><option value="scene">场景</option><option value="web">网页</option></select><span id="count"></span></div>
<main id="library"></main><footer>Steam / Wallpaper Engine 壁纸会自动发现。网页壁纸和无内嵌视频的场景使用预览图；没有预览图时保留当前背景。首次连接：完全退出 Codex，再从已配置的原有应用快捷方式重新打开。Ctrl+Alt+W 打开设置，连按四次 Esc 关闭壁纸。</footer>
</body></html>
